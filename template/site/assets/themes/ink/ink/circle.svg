  <path filter="url(#dry)" fill="none" stroke="#000" stroke-width="7.5" stroke-linecap="round" d="M66 13 C44 4 14 14 10 44 C6 72 30 93 58 88 C84 83 95 58 89 36 C84 20 70 11 50 13"/>
