<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40" preserveAspectRatio="none">
  <!-- 实心的一抹墨（没有飞白，只有毛边）：按钮、选中的选项。文字压在上面，所以不能有空隙。用作 mask -->
  <filter id="rough" x="-2%" y="-10%" width="104%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="4" result="edge"/>
    <feDisplacementMap in="SourceGraphic" in2="edge" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <path filter="url(#rough)" fill="#000" d="M10 5 C4 8 2 15 3 21 C4 29 7 35 16 35 C92 34 176 36 258 34 C318 33 370 32 394 28 C399 23 399 15 393 11 C344 7 300 6 240 5 C162 3 84 3 10 5 Z"/>
</svg>
