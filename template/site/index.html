<!doctype html>
<html lang="zh-CN" data-theme="ani-dark" data-map>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chlorophyll-Learn</title>
<link rel="icon" href="/favicon.svg">
<script>
  // 启动（放在最前面，免得先闪一下别的颜色）。
  // 笔墨和晨暮：选过的记在 lh:hub:theme，照旧认（以前的“昼 / 夜”存的就是 light / dark，现在叫“晨 / 暮”，值不用换）；
  // 没选过默认动画，5:00–17:00 晨，其余暮。?theme= 只在 ?dev=1 时认（截图、自检用）。
  // 再查一次 WebGL 2：没有就不加载 3D 地图的脚本（three.js 约 2 MB），直接用 2D 的雾图。
  // data-map：拨云“地图页”的配色（纸、雾、墨、朱、字体）只在有这个属性的页面生效，课程页不受影响。
  (function () {
    var ok = /^(cn|mod|ani)-(light|dark)$/, q = new URLSearchParams(location.search), t = q.get('dev') === '1' ? q.get('theme') : null;
    if (!ok.test(t || '')) { try { t = localStorage.getItem('lh:hub:theme'); } catch (e) { t = null; } }
    var hr = new Date().getHours();
    document.documentElement.setAttribute('data-theme', ok.test(t || '') ? t : 'ani-' + (hr >= 5 && hr < 17 ? 'light' : 'dark'));
    var gl2 = false;
    try { gl2 = !!(window.WebGL2RenderingContext && document.createElement('canvas').getContext('webgl2')); } catch (e) { gl2 = false; }
    window.__noGL2 = !gl2;
    window.__t0 = performance.now();   // 地图引擎的计时从这里算
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体不挡着页面渲染：断网时直接用系统字体。中式用霞鹜文楷和马善政（题字），现代、动画用 Geist 和思源黑体 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<!-- 拨云（Boyun）设计系统：site/assets/boyun/ 整份是拨云的导出文件，不在这里改；hub 自己的样式写在下面 -->
<link rel="stylesheet" href="/assets/boyun/boyun.css">
<link rel="stylesheet" href="/assets/boyun/map3d/boyun-map3d.css">
<style>
  /* hub 自己的样式：页头、3D 地图、本周的课的样式都在拨云的 boyun-map3d.css（地图首页）里，这里只放 2D 退路和几处小地方 */
  a.by-btn { text-decoration: none; }

  /* 2D 退路（没有地点数据、画不了 3D 时）：和原来的 2D 雾图一样。地图按世界坐标 1:1 显示：概念多了就左右拖，字不缩小 */
  #map { max-width: var(--map-w); margin: 0 auto; }
  #map .by-map__inner { width: var(--map-w); min-width: 0; }
  #map .dot.ex { fill: var(--ink-1); }
  /* boyun-map3d.css 里 3D 地名的 .lab 规则（描边、字重）也会落到 2D 的名字上：这里按 2D 原来的样子盖回去 */
  #map .lab { font-weight: 400; letter-spacing: .02em; fill: var(--ink-2); stroke: none !important; }
  #map .lab.ex { fill: var(--ink-1); }
  #map .known .lab { paint-order: stroke; stroke: var(--paper) !important; stroke-width: 4px; stroke-linejoin: round; }
  #map .roads, #map .known { pointer-events: none; }
  #map .hit rect { fill: transparent; }
  #map .hit:focus-visible rect { stroke: var(--focus); stroke-width: 1.5; }
  .hub-map2d .map-foot { padding-bottom: var(--space-7); }
</style>
</head>
<body>
<div class="bar-line">
<header class="wrap app-bar">
  <div class="brand">Chlorophyll-Learn</div>
  <div class="app-ctrl">
    <div class="by-seg" role="group" aria-label="笔墨" id="segReg"><button type="button" data-v="cn">中式</button><button type="button" data-v="mod">现代</button><button type="button" data-v="ani">动画</button></div>
    <div class="by-seg" role="group" aria-label="晨暮" id="segDay"><button type="button" data-v="light">晨</button><button type="button" data-v="dark">暮</button></div>
  </div>
</header>
</div>
<main id="app"><div class="wrap hub-head"><p class="hh-sub">读取课程清单…</p></div></main>
<footer class="wrap"><div class="foot" id="lab" hidden></div></footer>
<script src="/assets/boyun/boyun.js"></script>
<script type="module">
const app = document.getElementById('app');
const root = document.documentElement;
const WEEKDAY = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const CN_NUM = '〇一二三四五六七八九';
const KINDS = ['city', 'canyon', 'ferry', 'ruin'];   // 地标的四种；不写 = 峰
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ls = k => { try { return localStorage.getItem(k); } catch { return null; } };
const localDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
// 今天的日期，按学习者的时区：manifest 的 timezone（/build-week 从 learner/profile.md 抄过来，UTC+8 或 Asia/Shanghai 这样）；
// 没有就用电脑的时区
function todayIn(tz) {
  const d = new Date();
  const off = /^UTC([+-])(\d{1,2})(?::(\d{2}))?$/.exec(tz || '');
  if (off) return new Date(d.getTime() + (off[1] === '-' ? -1 : 1) * (Number(off[2]) * 60 + Number(off[3] || 0)) * 60000).toISOString().slice(0, 10);
  try { if (tz) return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d); } catch { /* 看不懂的时区 */ }
  return localDay(d);
}
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const isCn = () => /^cn/.test(root.dataset.theme || '');
const cnNum = n => (n < 10 ? CN_NUM[n] : n < 20 ? '十' + (n % 10 ? CN_NUM[n % 10] : '') : CN_NUM[Math.floor(n / 10)] + '十' + (n % 10 ? CN_NUM[n % 10] : ''));
// 调试参数只在 ?dev=1 时认（和地图引擎一样）：done=all|none|<课,…>、half=、today=、map=2d、nostore=1
const Q = new URLSearchParams(location.search);
const DEV = Q.get('dev') === '1';
const QD = k => (DEV ? Q.get(k) : null);
// 给自检看的：地图用的是 3D 还是 2D、为什么、页头和本周的课什么时候画好（从打开页面算，毫秒）
const HUB = window.__hub = { mode: null, why: null, headAt: null };

// 从课程页点“返回”回到这里时，浏览器可能直接拿出离开前的整页（往返缓存）：打卡记录是旧的，3D 地图的显存也已经还掉了。重开一次
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

// ---------- 读课程清单和地图数据（同时去取；地图数据读不到也不影响课程表） ----------
const mapReq = fetch('/map.json', { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).catch(() => null);
let m;
try {
  const r = await fetch('/manifest.json', { cache: 'no-store' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  m = await r.json();
} catch (e) {
  app.innerHTML = `<div class="wrap hub-head"><p class="hh-sub">读不到课程清单 manifest.json（${esc(e.message)}）。请确认是通过 start.cmd 打开的。</p></div>`;
  throw e;
}

const labBox = document.getElementById('lab');
if ((m.lab || []).length) {
  labBox.innerHTML = '平台自测：' + m.lab.map(x => `<a href="${esc(x.path)}">${esc(x.title)}</a>`).join('');
  labBox.hidden = false;
}

const slug = m.current?.topic;
const topic = slug && m.topics?.[slug];
const week = topic?.weeks?.find(w => w.week === m.current.week);
if (!week) {
  app.innerHTML = `<div class="wrap hub-head"><h1 class="page-title">还没有开始学习主题</h1>
    <p class="hh-sub">在 Claude Code 里输入 <code>/new-topic 主题名</code>，老师会先问你几个问题，然后准备第一周的内容。</p></div>`;
  HUB.mode = 'none';
  themeOnly();
} else {
  start();
}

// 还没有开始学习主题（没有课、没有地图）：笔墨和晨暮只换页面的颜色，也记下来。有课时的版本在 start() 里（还要通知地图）
function themeOnly() {
  const SEG = [['segReg', 0], ['segDay', 1]];
  const sync = () => {
    const c = (root.dataset.theme || 'ani-dark').split('-');
    for (const [id, i] of SEG) for (const b of document.querySelectorAll(`#${id} button`)) b.setAttribute('aria-pressed', String(b.dataset.v === c[i]));
  };
  for (const [id, i] of SEG) document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button[data-v]');
    if (!b) return;
    const c = (root.dataset.theme || 'ani-dark').split('-');
    c[i] = b.dataset.v;
    root.dataset.theme = c.join('-');
    try { localStorage.setItem('lh:hub:theme', root.dataset.theme); } catch { /* 记不住就只管这一次 */ }
    sync();
  });
  sync();
}

// ---------- 适配层 ① 课和进度 ----------
// 已开放的周（manifest 里本来就只有已开放的；比本周晚的再防一次），每节课一个 key：w01d3 这样
function openedWeeks() {
  return topic.weeks.filter(w => w.week <= week.week).sort((a, b) => a.week - b.week).map(w => ({
    week: w.week, title: w.title || '',
    lessons: w.lessons.map(l => ({
      key: `w${String(w.week).padStart(2, '0')}d${l.day}`, day: l.day, label: l.label || null, date: l.date || null,
      title: l.title, est: l.est, path: l.path,
    })),
  }));
}
// 打卡怎么算（和原来的 hub 一样）：lh:<课的路径>:done 有值 = 打卡了；没打卡、但有 lh:<路径>:time = 学到一半。
// ?dev=1&done=all|none|<key,…>、half=、today= 盖掉它们（另开一个端口测试时 localStorage 是空的；截图、验收用，规则和地图引擎一样）
function readProgress(weeks) {
  const all = weeks.flatMap(w => w.lessons);
  const list = s => s.split(',').map(x => x.trim()).filter(Boolean);
  const dq = QD('done'), hq = QD('half'), tq = QD('today');
  const done = dq == null ? all.filter(l => ls(`lh:${l.path}:done`)).map(l => l.key)
    : dq === 'all' ? all.map(l => l.key) : dq === 'none' ? [] : list(dq);
  const half = hq != null ? list(hq) : all.filter(l => !done.includes(l.key) && ls(`lh:${l.path}:time`)).map(l => l.key);
  const today = /^\d{4}-\d\d-\d\d$/.test(tq || '') ? tq : todayIn(m.timezone);
  return { done, half, today };
}

// ---------- 适配层 ② 地图引擎的输入（window.BOYUN_MAP3D，字段见 /assets/boyun/map3d/boyun-map3d.js 里 src/state.js 开头的说明） ----------
// 从 map.json 里只拿已开放的课的概念；连线、地点、区域、换位都只留指向这些概念的。地点的概念列表按每个概念的 place 收；
// 没写 place（或者写的地点不在、不在同一个区域）的概念自己成一座峰（id p:<概念 id>，名字 = 概念名）。难度没写的按 2（引擎补）
function mapInput(md, weeks, prog) {
  const regions = (md.regions || []).filter(r => r?.id).map(r => ({ id: r.id, label: r.label, ...(r.home ? { home: r.home } : {}) }));
  const regionIds = new Set(regions.map(r => r.id));
  const concepts = {}, placeOf = {};
  for (const w of weeks) {
    const days = md.weeks?.find(x => x.week === w.week)?.days || [];
    for (const l of w.lessons) {
      for (const c of days.find(d => d.day === l.day)?.map || []) {
        if (!c?.id || concepts[c.id] || !regionIds.has(c.region)) continue;
        concepts[c.id] = { label: c.label, region: c.region, difficulty: c.difficulty, links: c.links || [], week: w.week, day: l.day, ...(c.trap ? { trap: true } : {}) };
        placeOf[c.id] = c.place || null;
      }
    }
  }
  for (const c of Object.values(concepts)) c.links = c.links.filter(id => concepts[id]);
  const places = new Map();
  for (const p of md.places || []) {
    if (!p?.id || !regionIds.has(p.region)) continue;
    places.set(p.id, {
      id: p.id, label: p.label, region: p.region, concepts: [],
      ...(KINDS.includes(p.kind) ? { kind: p.kind } : {}), ...(Number.isFinite(p.seed) ? { seed: p.seed } : {}), ...(p.lore ? { lore: p.lore } : {}),
    });
  }
  for (const [id, c] of Object.entries(concepts)) {
    const p = places.get(placeOf[id]);
    if (p && p.region === c.region) p.concepts.push(id);
    else places.set(`p:${id}`, { id: `p:${id}`, label: c.label, region: c.region, concepts: [id] });
  }
  const used = [...places.values()].filter(p => p.concepts.length);
  const usedIds = new Set(used.map(p => p.id));
  return {
    topic: { slug, title: topic.title },
    current: { week: week.week },
    regions: regions.filter(r => used.some(p => p.region === r.id)),
    places: used,
    concepts,
    weeks,
    moves: (md.moves || []).filter(mv => Array.isArray(mv) && usedIds.has(mv[0]) && usedIds.has(mv[1])),
    progress: prog,
    store: `lh:hub:${slug}`,   // <store>:seen 和原来 2D 的是同一个键（看过哪些学过的概念，用来算“这次散开”）
    hooks: {},
  };
}

// ---------- 页面 ----------
function start() {
  const weeks = openedWeeks();
  const lessons = weeks.flatMap(w => w.lessons.map(l => ({ ...l, week: w.week })));
  const cur = lessons.filter(l => l.week === week.week);
  let P = readProgress(weeks);
  let mapInfo = null, statsExtra = '';
  const isDone = l => P.done.includes(l.key);
  const nextOf = () => cur.find(l => !isDone(l)) || null;   // 下一节要上的课：本周第一节还没打卡的
  const dayName = l => (l.week === 0 ? l.label || `Day ${l.day}` : l.date ? WEEKDAY[new Date(`${l.date}T12:00:00`).getDay()] : l.label || `第 ${l.day} 天`);
  const weekName = n => (n === 0 ? '导览' : isCn() ? `第${cnNum(n)}周` : `第 ${n} 周`);

  app.innerHTML = `
    <div class="wrap hub-head">
      <div class="hh-line1">
        <h1 class="page-title" id="title"></h1>
        <p class="hh-sub"><span class="hh-k" id="topic"></span><span id="wtitle"></span></p>
      </div>
      <div class="hh-line2">
        <p class="tonight" id="tonight"></p>
        <div class="hub-side"><div class="by-stats" id="stats"></div><div class="hub-level" id="level"></div></div>
      </div>
    </div>
    <section class="hub-map hub-map3d loading" id="hubMap" aria-label="知识地图" hidden>
      <div class="map3d" id="map3d">
        <canvas id="gl" aria-hidden="true"></canvas>
        <svg id="over" role="group" aria-label="知识地图：点一个地点，看里面的概念；方向键在地点之间移动"><g id="pan"></g></svg>
      </div>
      <p class="map-caption" id="cleared"></p>
      <aside class="by-panel is-float hub-panel" id="panel" tabindex="-1" aria-live="polite" hidden></aside>
    </section>
    <div class="wrap map-foot" id="legend" hidden></div>
    <section class="hub-map hub-map2d" id="mapSec" aria-label="知识地图" hidden>
      <div class="map-wrap"><div id="map"></div><aside class="by-panel is-float map-panel" id="panel2d" aria-live="polite" hidden></aside></div>
      <div class="wrap map-foot"><p id="why2d" hidden></p><p>实心的点是你打卡过的概念。雾里看得见名字的，是本周还没学的。点一个，看它在哪节课。</p></div>
    </section>
    <section class="wrap hub-week">
      <p class="sect-k">本周的课</p>
      <ol class="days" id="days"></ol>
      <div id="past"></div>
    </section>`;
  const $ = id => document.getElementById(id);

  // 页头：标题、这一周、今晚的入口、数字。先画，不等地图
  function renderHead() {
    const next = nextOf();
    $('title').textContent = weekName(week.week);
    $('topic').textContent = topic.title;
    $('wtitle').textContent = week.title || '';
    if (next) {
      const when = next.date && next.date === P.today ? '今晚' : '下一节';
      $('tonight').innerHTML = `<a class="by-btn" href="${esc(next.path)}">去上课</a><span class="t">${when}：<b>${esc(dayName(next))}　${esc(String(next.title).split('：')[0])}</b>${next.est ? `<span class="meta">约 ${esc(next.est)} 分钟</span>` : ''}</span>`;
    } else {
      $('tonight').innerHTML = week.week === 0 ? '<span class="t">导览课打卡了。</span>'
        : '<span class="t">这周的课都打卡了。周末在 Claude Code 里跟老师说「开始周末练习」。</span>';
    }
    renderStats();
  }
  // 第一个数字是“本周已打卡 n / N”（页面自己数）；3D 地图画好第一帧（onReady）再加“本周登上”“雾全散”；2D 退路加“已点亮的概念”
  function renderStats() {
    const stat = (b, k) => `<span class="by-stat"><b>${b}</b>${k}</span>`;
    const w = mapInfo?.week;
    $('stats').innerHTML = stat(`${cur.filter(isDone).length}<small> / ${cur.length}</small>`, '本周已打卡')
      + (w ? stat(`${w.up}<small> 处</small>`, '本周登上') + stat(`${w.full}<small> 处</small>`, '雾全散') : '') + statsExtra;
  }
  // 本周的课（实心 = 打卡了，半个 = 学到一半，空心 = 还没有）、周末、之前的周
  function renderWeek() {
    $('days').innerHTML = cur.map(l => {
      const d = isDone(l), h = !d && P.half.includes(l.key), isToday = l.date === P.today;
      const st = d ? '已打卡' : h ? '学到一半' : '';
      return `<li class="${[d && 'done', h && 'started', isToday && 'today'].filter(Boolean).join(' ')}"><a href="${esc(l.path)}">
        <span class="mk" aria-hidden="true">${d ? '●' : h ? '◐' : '○'}</span>
        <span class="d">${esc(dayName(l))}${isToday ? '<span class="now">今天</span>' : ''}</span>
        <span class="t">${esc(l.title)}</span>
        <span class="meta">${st ? `<span class="st">${st}</span>` : ''}约 ${esc(l.est)} 分钟</span></a></li>`;
    }).join('') + (week.week > 0
      ? `<li class="weekend"><div class="row"><span class="mk" aria-hidden="true"></span><span class="d">周末</span>
          <span class="t">复习和动手练习：在 Claude Code 里跟老师说「开始周末练习」</span><span class="meta">不限时</span></div></li>` : '');
    const past = weeks.filter(w => w.week < week.week);
    $('past').innerHTML = past.length ? `<details class="past"><summary>之前的周</summary><ul>${past.map(w =>
      w.lessons.map(l => `<li><a href="${esc(l.path)}">${w.week === 0 ? '导览' : `第 ${w.week} 周`}：${esc(l.title)}</a></li>`).join('')).join('')}</ul></details>` : '';
  }
  renderHead();
  renderWeek();
  HUB.headAt = Math.round(performance.now());

  // 笔墨 / 晨暮：先记下来，再交给地图（换晨暮页内重画；换笔墨时峡谷的形要变，地图先合拢一层雾、整页重开）。
  // 3D 还没好、用的是 2D 时只换颜色（2D 自己跟着重画）
  function syncSeg() {
    const c = (root.dataset.theme || 'ani-dark').split('-');
    for (const [id, i] of [['segReg', 0], ['segDay', 1]]) for (const b of document.querySelectorAll(`#${id} button`)) b.setAttribute('aria-pressed', String(b.dataset.v === c[i]));
  }
  for (const [id, i] of [['segReg', 0], ['segDay', 1]]) $(id).addEventListener('click', e => {
    const b = e.target.closest('button[data-v]');
    if (!b) return;
    const c = (root.dataset.theme || 'ani-dark').split('-');
    c[i] = b.dataset.v;
    const t = c.join('-');
    try { localStorage.setItem('lh:hub:theme', t); } catch { /* 记不住就只管这一次 */ }
    const ui = HUB.mode === '3d' && window.MAP3?.ui;
    if (!(ui?.setTheme && ui.setTheme(t))) root.dataset.theme = t;
    syncSeg();
    renderHead();   // 标题跟着笔墨：中式写“第一周”
  });
  syncSeg();

  // ---------- 地图：有地点数据、能画 3D 就用 3D，不然退回 2D 雾图 ----------
  mapReq.then(md => {
    const tp = md?.topics?.[slug];
    if (!tp?.regions?.length) return;   // 没有地图数据：只有课程表（和原来一样）
    if (QD('map') === '2d') return show2D(tp, 'dev');
    if (!tp.places?.length) return show2D(tp, 'noplaces');   // 旧格式：整门课还没有地点数据
    const input = mapInput(tp, weeks, P);
    if (!input.places.length) return show2D(tp, 'noplaces');   // 已开放的周里一个概念都没有
    if (window.__noGL2) return show2D(tp, 'nowebgl2');
    let fell = false;
    const fallBack = why => { if (fell) return; fell = true; window.__failed = why; show2D(tp, why); };
    input.hooks = {
      onReady(info) { mapInfo = info; renderStats(); },
      onFail: fallBack,   // nowebgl2、init（初始化出错）、contextlost（显卡重置、显存不够）
    };
    window.BOYUN_MAP3D = input;
    HUB.mode = '3d';
    $('hubMap').hidden = false;
    $('legend').hidden = false;
    // 页头和本周的课先出来；地图区是一层雾。下一帧再加载 three.js 和引擎（约 3.5 MB；服务器回 304，第二次打开不用重下）
    requestAnimationFrame(() => setTimeout(() => {
      const base = '/assets/boyun/map3d/';
      for (const f of ['vendor/three.iife.js', 'boyun-map3d.js', ...(DEV ? ['boyun-map3d-dev.js'] : [])]) {
        const s = document.createElement('script');
        s.src = base + f;
        s.async = false;   // 并行下载、按顺序执行
        s.onerror = () => { console.error(`加载不了 ${s.src}`); fallBack('init'); };
        if (f === 'boyun-map3d.js') s.onload = () => {
          if (fell) return;
          if (!window.MAP3?.ui) return fallBack('init');   // 引擎没起来，也没调 onFail（例如 three.js 坏了）
          // 引擎算好的进度（规则和上面一样）为准，再画一遍页头和本周的课
          if (window.MAP?.progress) { const g = window.MAP.progress(); P = { done: g.done, half: g.half, today: g.today }; renderHead(); renderWeek(); }
        };
        document.body.append(s);
      }
    }, 0));
  });

  // ---------- 2D 退路：原来 hub 的 2D 雾图（下面 show2D、layout、fogMap 是原来的 showMap 那一段，只把“打卡没有”换成上面算好的进度） ----------
  const WHY = { nowebgl2: '这个浏览器没有 WebGL 2', init: '3D 地图初始化出错', contextlost: '显卡把画布收回去了（驱动重置或显存不够）' };
  // 只放两种节点：已学（那节课打卡了）和本周还没学的。之前的周没打卡的课、还没开放的周都不放：
  // 页面源码里也不能有它们（map.json 本来就只有已开放的周）
  function show2D(md, why) {
    HUB.mode = '2d';
    HUB.why = why;
    $('hubMap').hidden = true;
    $('legend').hidden = true;
    if (WHY[why]) { $('why2d').textContent = `这台电脑画不了 3D 地图（${WHY[why]}），先用平面的地图。`; $('why2d').hidden = false; }
    const next = nextOf();
    const when = (w, l) => (w.week === 0 ? `导览课（${l.label || `Day ${l.day}`}）` : `第 ${w.week} 周，${dayName({ ...l, week: w.week })}`);
    const lessons2 = weeks.flatMap(w => w.lessons.map(l => ({
      l, w, map: md.weeks?.find(x => x.week === w.week)?.days?.find(d => d.day === l.day)?.map || [],
    })));
    const all = layout(md.regions, lessons2, isDone);
    const nodes = all.filter(n => n.learned || n.w.week === week.week);
    if (!nodes.length) return;

    // 地图大小只由放进来的节点决定：按它们的范围裁出来，雾的外面什么都没有。左边留出区域名的位置
    const regionW = r => r.label.length * 17.6 + 12; // 现代笔墨横排：13px 字加 .35em 字距
    const ox = Math.min(...nodes.map(n => n.x)) - Math.max(...md.regions.map(regionW)) - 14;
    const oy = Math.min(...nodes.map(n => n.y)) - 30;
    for (const n of nodes) { n.x -= ox; n.y -= oy; }
    const W = Math.ceil(Math.max(...nodes.map(n => n.x + 11 + n.lw)) + 28);
    const H = Math.ceil(Math.max(...nodes.map(n => n.y)) + 30);

    const by = new Map(nodes.map(n => [n.id, n]));
    const edges = [];
    for (const n of nodes) for (const id of n.links || []) if (by.has(id) && id !== n.id) edges.push([by.get(id), n]);
    // 区域名放在这一块第一个节点的左边；那个节点学过了，区域名就和它一起露出来
    const regions = md.regions.map(r => {
      const first = nodes.filter(n => n.region === r.id).sort((a, b) => a.x - b.x || a.y - b.y)[0];
      return first && { label: r.label, x: first.x - regionW(r), y: first.y + 5, lit: first.learned };
    }).filter(Boolean);
    // 朱色焦点：下一节课的第一个概念（planner 把这节课最核心的概念排在第一个）；本周都打卡了就没有
    const nextFirst = next && lessons2.find(x => x.l.key === next.key)?.map[0]?.id;
    const focus = (next && (by.get(nextFirst) || nodes.find(n => n.l.key === next.key))) || null;

    // 第一次看到某个已学的概念时，它那一片雾散开（记在 lh:hub:<主题>:seen，和 3D 地图同一个键；?dev=1&nostore=1 不读也不写）
    const SEEN = `lh:hub:${slug}:seen`, nostore = !!QD('nostore');
    let seen = [];
    try { seen = JSON.parse((!nostore && ls(SEEN)) || '[]'); } catch { /* 坏数据就当没看过 */ }
    for (const n of nodes) n.fresh = n.learned && !seen.includes(n.id);
    if (!nostore) { try { localStorage.setItem(SEEN, JSON.stringify(nodes.filter(n => n.learned).map(n => n.id))); } catch { /* 记不住就每次都散一遍 */ } }

    statsExtra = `<span class="by-stat"><b>${nodes.filter(n => n.learned).length}</b>已点亮的概念</span>`;
    mapInfo = null;
    renderStats();
    $('mapSec').hidden = false;

    const box = $('map'), panel = $('panel2d');
    const map = fogMap(box, { W, H, nodes, edges, regions, focus, onSelect: openPanel });
    // 一打开就能看到焦点：焦点在右边看不见的地方才滚过去；全都学完了就停在最新的地方
    const sc = map.scroll;
    if (focus) { if (focus.x > sc.clientWidth * 0.7) sc.scrollLeft = focus.x - sc.clientWidth * 0.4; } else sc.scrollLeft = sc.scrollWidth;

    function openPanel(n) {
      const isNext = next && n.l.key === next.key, where = when(n.w, n.l);
      panel.innerHTML = `<button class="by-panel__close" type="button" data-close>收起</button>
        <p class="by-panel__k">${esc(n.regionLabel)}</p>
        <h3 class="by-panel__title">${esc(n.label)}</h3>
        <p class="by-panel__sub">${n.learned ? `${esc(where)}学的` : `${esc(where)}的课`}</p>
        <p class="p-text">${esc(n.l.title)}</p>
        ${n.learned ? '' : `<p class="p-note">${isNext ? '下一节课就讲它。' : '这周还没学到。'}打卡之后，这一片雾会散开。</p>`}
        <div class="p-actions"><a class="by-btn by-btn--line" href="${esc(n.l.path)}">${n.learned ? '回到这节课' : '去上这节课'}</a></div>`;
      // 节点在看得见的那一段的右半边，面板就放左边，免得盖住它
      panel.classList.toggle('left', n.x - sc.scrollLeft + box.offsetLeft > box.parentElement.clientWidth / 2);
      panel.hidden = false;
      panel.querySelector('[data-close]').addEventListener('click', closePanel);
      if (matchMedia('(max-width: 820px)').matches) panel.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
    }
    function closePanel() { panel.hidden = true; map.deselect(); }
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) closePanel(); });
  }
}

// ---------- 2D 地图布局 ----------
// 区域从上到下排成横带（顺序和每条带的车道数在 map.json 里，开课后不改），课按 manifest 的顺序从左到右排成列。
// 同一节课、同一区域的概念先竖着排满车道，再往右开一小列；单数车道往右错开一点，免得排成方阵。
// 每节课的位置只取决于它前面的课，所以加了新一周，旧节点不动。课和课之间留一道缝，学过的那一片雾散开时不会漫到下一节课
function layout(regions, lessons, isDone) {
  const LANE = 34, SUB = 176, GAP = 44, BAND = 22;
  const band = {};
  let y = 0;
  for (const r of regions) { band[r.id] = { y, lanes: r.lanes || 2, label: r.label }; y += band[r.id].lanes * LANE + BAND; }
  const out = [];
  let x = 0;
  for (const { l, w, map } of lessons) {
    let cols = 0;
    for (const r of regions) {
      const ns = map.filter(n => n.region === r.id), b = band[r.id];
      ns.forEach((n, i) => {
        const lane = i % b.lanes;
        out.push({
          ...n, l, w, regionLabel: b.label, learned: isDone(l), lw: textWidth(n.label),
          x: x + Math.floor(i / b.lanes) * SUB + (lane % 2) * 18, y: b.y + lane * LANE + LANE / 2,
        });
      });
      cols = Math.max(cols, Math.ceil(ns.length / b.lanes));
    }
    if (cols) x += cols * SUB + GAP;
  }
  return out;
}
// 名字有多宽（世界坐标，15px 字）：汉字约 15.5，英文和数字约 8.6
function textWidth(s) { return Math.ceil([...s].reduce((sum, c) => sum + (c.charCodeAt(0) < 0x2000 ? 8.6 : 15.5), 0)) + 4; }

// ---------- 2D 迷雾地图的绘制 ----------
// 结构和样式沿用拨云的 Boyun.map（boyun.css 的 .by-map），雾用 Boyun.fog。没直接调 Boyun.map，因为这里要的它给不了，
// 而拨云文件要保持原样，方便以后整份同步：
//   1. 本周还没学的概念都要隔着薄雾看得见名字；Boyun.map 只让和已学相连的点露出名字
//   2. 名字中英文混排、比较长，点又挤：雾要沿着整个名字散开，点击范围也要贴着名字，不然会点到旁边的
//   3. 按世界坐标 1:1 显示，宽了就左右拖
// （下面都是函数声明：上面的主流程先调用它们，声明会被提前）
function svg(tag, attrs, parent) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent?.append(e);
  return e;
}
function token(n) { return getComputedStyle(root).getPropertyValue(n).trim(); }
// 两个点之间的路。接到后面某节课的：从旧概念名字的末尾出发，稍微弯一点（弯法和 Boyun.map 一样），免得从自己的名字中间穿过去；
// 同一节课里上下两个点之间的：往左鼓出去，离得越远鼓得越多，免得穿过中间别的点
function curve(a, b) {
  const f = n => n.toFixed(1);
  if (Math.abs(b.x - a.x) <= 60) {
    return `M${f(a.x)} ${a.y} Q${f(Math.min(a.x, b.x) - 0.4 * Math.abs(b.y - a.y))} ${f((a.y + b.y) / 2)} ${f(b.x)} ${b.y}`;
  }
  const p = { x: a.x + 13 + a.lw, y: a.y }, q = { x: b.x - 7, y: b.y };
  const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2, dx = q.x - p.x, dy = q.y - p.y, L = Math.hypot(dx, dy) || 1;
  const k = 0.07 * L * (Math.round(a.x + b.y) % 3 ? 1 : -1);
  return `M${f(p.x)} ${p.y} Q${f(mx - dy / L * k)} ${f(my + dx / L * k)} ${f(q.x)} ${q.y}`;
}

function fogMap(box, { W, H, nodes, edges, regions, focus, onSelect }) {
  box.classList.add('by-map');
  box.style.setProperty('--map-w', `${W}px`);
  const scroll = document.createElement('div');
  scroll.className = 'by-map__scroll';
  const inner = document.createElement('div');
  inner.className = 'by-map__inner';
  inner.style.aspectRatio = `${W} / ${H}`;
  const terr = svg('svg', { viewBox: `0 0 ${W} ${H}`, 'aria-hidden': 'true' });
  const cv = document.createElement('canvas');
  cv.className = 'by-map__fog';
  cv.setAttribute('aria-hidden', 'true');
  const over = svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'group', 'aria-label': '知识地图：实心的点是学过的概念，雾里的是本周还没学的' });
  inner.append(terr, cv, over);
  scroll.append(inner);
  box.replaceChildren(scroll);

  // 地形（雾下面）：区域名、还没走过的路、点、名字。中式笔墨下区域名竖排，所以换笔墨时重画
  const trod = ([a, b]) => a.learned && b.learned;
  function terrain() {
    terr.replaceChildren();
    const vertical = token('--by-texture') === 'ink';
    for (const r of regions) {
      const t = svg('text', { x: r.x, y: r.y, class: 'region' }, terr);
      if (vertical) [...r.label].forEach((ch, i) => { svg('tspan', { x: r.x, dy: i ? '1.25em' : '0' }, t).textContent = ch; });
      else t.textContent = r.label;
    }
    const g = svg('g', {}, terr);
    for (const e of edges) if (!trod(e)) svg('path', { d: curve(...e), class: 'edge' }, g);
    for (const n of nodes) if (!n.learned) place(n, terr);
  }
  function place(n, layer) {
    svg('circle', { cx: n.x, cy: n.y, r: 5, class: n.learned ? 'dot ex' : 'dot fr' }, layer);
    svg('text', { x: n.x + 11, y: n.y + 5, class: n.learned ? 'lab ex' : 'lab' }, layer).textContent = n.label;
  }
  terrain();
  new MutationObserver(terrain).observe(root, { attributes: true, attributeFilter: ['data-theme'] });

  // 雾：Boyun.fog 的圆中间一圈是平的，沿着名字铺一串圆，整个名字一样清楚。
  // 已学的散得开一些（SEE）；本周的只在名字上薄一层（MIST），能见度 GL；下一节课那一处更清楚一点（GF）
  const SEE = 56, MIST = 26, GL = 0.6, GF = 0.8;
  const anim = !reduced();
  const start = [], goal = [];
  // 从 (x0, y0) 到 (x1, y1) 每隔 step 放一个圆
  const chain = (x0, y0, x1, y1, from, to, step) => {
    const k = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / step));
    for (let i = 0; i <= k; i++) { start.push({ x: x0 + (x1 - x0) * i / k, y: y0 + (y1 - y0) * i / k, ...from }); goal.push(to); }
  };
  const lit = { w: 1, r: SEE }, mist = { w: GL, r: MIST };
  // 区域名横排和竖排都要盖到：进过这块区域就散开，还没进过就和本周的名字一样隔着薄雾
  for (const r of regions) {
    const s = r.lit ? lit : mist, len = r.label.length;
    chain(r.x - 2, r.y - 4, r.x + len * 17.6 - 6, r.y - 4, s, s, 14);
    chain(r.x + 6, r.y - 4, r.x + 6, r.y - 4 + (len - 1) * 16, s, s, 14);
  }
  for (const n of nodes) {
    const x0 = n.x - 4, x1 = n.x + 11 + n.lw;
    if (n.learned) chain(x0, n.y, x1, n.y, anim && n.fresh ? mist : lit, lit, 24);
    else if (n === focus) chain(x0, n.y, x1, n.y, anim ? { w: 0, r: MIST } : { w: GF, r: MIST }, { w: GF, r: MIST }, 14);
    else chain(x0, n.y, x1, n.y, mist, mist, 14);
  }
  const fog = Boyun.fog(cv, { width: W, height: H, sources: start });

  // 浮层（雾上面）：走过的路、学过的点和名字、朱色焦点、选中的圈、点击范围。
  // 两头都学过的路画在雾上面：两头都认得，路也就认得；中间隔着没去过的空地也看得见。刚打卡的那几条等雾散开时再出现。
  // 学过的名字压在路上面，描一圈纸色的边，路从名字底下过去
  const roads = svg('g', { class: 'roads' }, over);
  const road = e => svg('path', { d: curve(...e), class: 'edge trod' }, roads);
  const fresh = e => anim && (e[0].fresh || e[1].fresh);
  edges.filter(e => trod(e) && !fresh(e)).forEach(road);
  const known = svg('g', { class: 'known' }, over);
  for (const n of nodes) if (n.learned) place(n, known);
  if (focus) svg('circle', { cx: focus.x, cy: focus.y, r: 10, class: 'focus' }, over);
  const ring = svg('circle', { cx: 0, cy: 0, r: 14, class: 'sel', visibility: 'hidden' }, over);
  for (const n of nodes) {
    const g = svg('g', { class: 'hit', tabindex: '0', role: 'button', 'aria-label': `${n.label}，${n.learned ? '学过了' : '本周还没学'}` }, over);
    svg('rect', { x: n.x - 12, y: n.y - 15, width: n.lw + 26, height: 30 }, g);
    const go = () => { ring.setAttribute('cx', n.x); ring.setAttribute('cy', n.y); ring.removeAttribute('visibility'); onSelect(n); };
    g.addEventListener('click', go);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  }

  // 进场：新打卡的那几处雾散开，下一节课那一处点亮一次，之后一切静止。减少动态效果时直接是最后的样子
  if (anim) setTimeout(() => {
    goal.forEach((t, i) => { if (t.w !== start[i].w || t.r !== start[i].r) fog.set(i, t.w, t.r); });
    edges.filter(e => trod(e) && fresh(e)).forEach(road);
    if (!focus) return;
    const c = svg('circle', { cx: focus.x, cy: focus.y, r: 10, class: 'pulse' }, over);
    c.animate([{ transform: 'scale(1)', opacity: 0.9 }, { transform: 'scale(3)', opacity: 0 }],
      { duration: parseFloat(token('--dur-settle')) || 1800, easing: token('--ease-mist') || 'ease-out', fill: 'forwards' })
      .finished.then(() => c.remove(), () => {});
  }, 600);

  return { scroll, deselect: () => ring.setAttribute('visibility', 'hidden') };
}
</script>
</body>
</html>
