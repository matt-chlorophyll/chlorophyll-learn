<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>遗忘曲线</title>
<link rel="stylesheet" href="/assets/component.css">
<style>
  svg { display: block; width: 100%; height: auto; }
  .axis text { font: 12px var(--sans); fill: var(--pencil); }
  .axis line, .grid line { stroke: var(--rule); }
  .curve { fill: none; stroke: var(--ink); stroke-width: 2.5; }
  .base { fill: none; stroke: var(--pencil); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .review { fill: var(--marker); stroke: #b39600; }
  .end { font: 700 14px var(--sans); fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
  .days label { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; }
  .days label:has(input:checked) { background: var(--marker); border-color: #b39600; }
</style>
</head>
<body>
  <div class="stack">
    <div class="row days" id="days"></div>
    <svg id="chart" viewBox="0 0 640 280" role="img" aria-label="遗忘曲线"></svg>
    <div class="row">
      <button id="preset" class="primary">按平台节奏复习</button>
      <button id="none">一次都不复习</button>
      <span class="muted">虚线：从不复习；实线：按你勾选的日子复习</span>
    </div>
  </div>
<script type="module">
import { emit } from '/assets/component.js';

const DAYS = [1, 3, 7, 14, 30];
const W = 640, H = 280, L = 44, R = 16, T = 16, B = 34;
const x = d => L + (d / 30) * (W - L - R);
const y = r => T + (1 - r) * (H - T - B);
const svg = document.getElementById('chart');
const box = document.getElementById('days');
const checks = DAYS.map(d => {
  const label = document.createElement('label');
  label.innerHTML = `<input type="checkbox" value="${d}" checked> 第 ${d} 天复习`;
  box.append(label);
  return label.querySelector('input');
});

// 简化模型：记忆强度 S 天，保持率 R = e^(-t/S)；每复习一次 S 变为 2.5 倍
function retention(reviews) {
  const pts = [];
  let S = 1.2, last = 0;
  for (let d = 0; d <= 30.001; d += 0.1) {
    const hit = reviews.find(r => r > last && d >= r);
    if (hit) { last = hit; S *= 2.5; }
    pts.push([d, Math.exp(-(d - last) / S)]);
  }
  return pts;
}
const path = pts => pts.map(([d, r], i) => `${i ? 'L' : 'M'}${x(d).toFixed(1)},${y(r).toFixed(1)}`).join('');

function draw() {
  const reviews = checks.filter(c => c.checked).map(c => Number(c.value)).filter(d => d < 30);
  const pts = retention(reviews);
  const end = pts.at(-1)[1];
  svg.innerHTML = `
    <g class="grid">${[0.25, 0.5, 0.75, 1].map(r => `<line x1="${L}" x2="${W - R}" y1="${y(r)}" y2="${y(r)}"/>`).join('')}</g>
    <g class="axis">
      ${[0, 0.5, 1].map(r => `<text x="${L - 8}" y="${y(r) + 4}" text-anchor="end">${r * 100}%</text>`).join('')}
      ${[0, 7, 14, 21, 30].map(d => `<text x="${x(d)}" y="${H - 10}" text-anchor="middle">${d} 天</text>`).join('')}
    </g>
    <path class="base" d="${path(retention([]))}"/>
    <path class="curve" d="${path(pts)}"/>
    ${reviews.map(d => `<circle class="review" cx="${x(d)}" cy="${y(1)}" r="6"/>`).join('')}
    <text class="end" x="${W - R}" y="${y(end) - 14}" text-anchor="end">30 天后约 ${Math.round(end * 100)}%</text>`;
  return end;
}

function changed(source) {
  const end = draw();
  emit('viz_forgetting', { source, reviews: checks.filter(c => c.checked).map(c => +c.value), end: Math.round(end * 100) });
}
checks.forEach(c => c.addEventListener('change', () => changed('toggle')));
document.getElementById('preset').onclick = () => { checks.forEach(c => { c.checked = true; }); changed('preset'); };
document.getElementById('none').onclick = () => { checks.forEach(c => { c.checked = false; }); changed('none'); };
draw();
</script>
</body>
</html>
